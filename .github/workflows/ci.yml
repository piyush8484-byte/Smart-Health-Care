name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: smart-healthcare

    env:
      NODE_ENV: test
      PORT: 5000
      MONGODB_URI: mongodb://127.0.0.1:27017/smart-healthcare
      CLIENT_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: test-access-secret-1234567890
      JWT_REFRESH_SECRET: test-refresh-secret-1234567890
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      DEMO_PASSWORD: DemoPass123!

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test --workspace server -- --runInBand

      - name: Build server
        run: npm run build --workspace server

      - name: Build client
        run: npm run build --workspace client
